name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The preview is plain static files: index.html loads preview/shell.html,
      # which loads the core CSS from stylesheets/ and a theme from themes/<name>/.
      #
      # This repo keeps the themes at the root, because that is the folder you copy
      # into an install. Staging them under themes/ gives the site the layout it
      # expects and mirrors a real Redmine tree, so each theme's own
      # `@import ../../../stylesheets/application.css` resolves to the vendored core
      # CSS exactly as it would in production. Nothing is built or rewritten.
      - name: Stage the site
        run: |
          mkdir -p _site/themes
          cp index.html _site/
          cp -r preview stylesheets _site/
          for theme in atlas zen umbra dense folio; do
            test -f "$theme/stylesheets/application.css" || { echo "missing theme: $theme"; exit 1; }
            cp -r "$theme" _site/themes/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
