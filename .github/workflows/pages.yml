name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The preview is plain static files that already sit at the repo root:
      # index.html loads preview/shell.html, which loads the core CSS from
      # stylesheets/ and the theme it is showing from that theme's own folder.
      # Nothing to build — stage exactly those paths and publish them.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r preview stylesheets _site/
          for theme in atlas zen umbra dense folio; do
            test -f "$theme/stylesheets/application.css" || { echo "missing $theme"; exit 1; }
            cp -r "$theme" _site/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
