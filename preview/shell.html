  <p class="author">Added by <a href="#">Priya Nandakumar</a> 4 days ago. Updated 2 hours ago.</p>
  <table class="attributes">
    <tr><th class="status">Status:</th><td class="status">In Progress</td><th class="start-date">Start date:</th><td class="start-date">03 Aug 2026</td></tr>
    <tr><th class="priority">Priority:</th><td class="priority">High</td><th class="due-date">Due date:</th><td class="due-date">14 Aug 2026</td></tr>
    <tr><th class="assigned-to">Assignee:</th><td class="assigned-to"><span class="gravatar"></span> <a href="#">Priya Nandakumar</a></td><th class="progress">% Done:</th><td class="progress"><table class="progress"><tr><td class="closed" style="width:60%"></td><td class="todo" style="width:40%"></td></tr></table><p class="percent">60%</p></td></tr>

  <div class="description">
    <h3>Description</h3>
    <div class="wiki">
      <p>On passes above 40 Mbit/s the ingest buffer fills faster than the writer drains it, and the tail of the pass is dropped. Reproduced twice on GS-04 and once on GS-11.</p>
      <pre>[ingest] warn buffer_high_water=0.98 dropped_frames=1421 pass=GS-04/2026-08-05T22:14Z</pre>
      <p>Likely the writer flush interval is fixed at 250 ms regardless of rate. Suggested fix: scale the interval with observed throughput, and expose the high-water mark as a metric.</p>
    </div>
  </div>
</div>

<template data-page="wiki">
<div class="contextual"><a href="#" class="button">Edit</a> <a href="#" class="button secondary">History</a></div>
<h2>Pass scheduling</h2>
<div class="wiki wiki-page">
  <p>The scheduler allocates satellite passes to ground stations. It runs every fifteen minutes and on demand when an operator edits a window.</p>
  <h2>Allocation order</h2>
  <p>Passes are sorted by priority, then by elevation. Conflicts are resolved before allocation rather than during it, which keeps the result stable across runs.</p>
  <ol>
    <li>Collect candidate windows for the next 48 hours.</li>
    <li>Drop windows below the minimum elevation for the station.</li>
    <li>Resolve conflicts by priority, then by earliest acquisition of signal.</li>
    <li>Emit the allocation and notify the ops channel.</li>
  </ol>
  <h2>Pinning a station</h2>
  <p>An operator may pin a pass to a specific station. Pinned passes are allocated first and never displaced by the conflict resolver.</p>
  <pre>schedule:
  horizon_hours: 48
  min_elevation_deg: 10
  pin_respects_conflicts: false</pre>
  <p>See also <a href="?page=issue">#4818</a> for the pinning work in progress.</p>
</div>
</template>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var theme = p.get('theme') || 'atlas';
  var page = p.get('page') || 'issues';
  var mode = p.get('mode');

  document.getElementById('theme-css').href = '../' + theme + '/stylesheets/application.css';
  if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-rm-mode', mode);

  function tpl(sel) { var t = document.querySelector(sel); return t ? t.innerHTML : ''; }

  document.getElementById('content').innerHTML =
    tpl('template[data-page="' + (page === 'issue-edit' ? 'issue' : page) + '"]') || tpl('template[data-page="issues"]');

  if (page === 'issue-edit') {
    var up = document.getElementById('update');
    if (up) up.style.display = '';
  }

  /* Redmine reveals the edit form in place rather than navigating; do the same
     so the Edit button gives a true feel for the reworked editor. */
  var editLink = document.querySelector('#content .contextual a[href="?page=issue-edit"]');
  if (editLink) {
    editLink.addEventListener('click', function (e) {
      var up = document.getElementById('update');
      if (!up) return;
      e.preventDefault();
      e.stopPropagation();
      up.style.display = '';
      var box = up.querySelector('.box');
      window.scrollTo({ top: up.offsetTop - 24, behavior: 'smooth' });
      var ta = up.querySelector('#issue_notes');
      if (ta) ta.focus({ preventScroll: true });
    }, true);
  }
  if (page === 'gantt') buildGantt();

  var sb = tpl('template[data-sidebar="' + page + '"]');
  if (!sb && (page === 'issue' || page === 'issue-edit' || page === 'issue-form' || page === 'roadmap')) sb = tpl('template[data-sidebar="issues"]');
  if (!sb) sb = tpl('template[data-sidebar="default"]');
  document.getElementById('sidebar-wrapper').innerHTML = sb;

  // login has no project chrome
  if (page === 'login') {
    document.getElementById('header').style.display = 'none';
    document.getElementById('main').className = 'nosidebar';
    document.body.classList.remove('has-main-menu');
  }

  // reflect the current page in the project menu
  var sel = document.querySelector('#main-menu a.' + (page === 'issue' || page === 'issue-edit' ? 'issues' : page));
  if (sel) {
    var cur = document.querySelector('#main-menu a.selected');
    if (cur) cur.classList.remove('selected');
    sel.classList.add('selected');
  }

  // keep ?theme= across in-preview navigation
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="?page="]');
    if (!a) return;
    e.preventDefault();
    var u = new URL(a.getAttribute('href'), location.href);
    u.searchParams.set('theme', theme);
    if (mode) u.searchParams.set('mode', mode);
    location.href = u.toString();
  });

  var s = document.createElement('script');
  s.src = '../' + theme + '/javascripts/theme.js';
  document.body.appendChild(s);

  /* Faithful Redmine gantt DOM: absolutely positioned headers, 16px subject
     rows and .task bars, matching app/views/gantts + gantt.css. */
  function buildGantt() {
    var mount = document.getElementById('gantt-mount');
    if (!mount) return;

    var DAY = 34, ROW = 20, HDR = 48, SUBJ = 300;
    var start = new Date(2026, 7, 3), days = 21;
    var names = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

    var rows = [
      { kind: 'version', label: '2.3.6', from: 1, len: 6, done: 100 },
      { kind: 'issue', label: '#4804 Anomaly digest sends duplicate rows', from: 1, len: 5, done: 80 },
      { kind: 'version', label: '2.4.0', from: 8, len: 12, done: 38 },
      { kind: 'issue', label: '#4821 Downlink buffer overruns', from: 8, len: 7, done: 60 },
      { kind: 'issue', label: '#4818 Pin a ground station to a pass', from: 12, len: 5, done: 0 },
      { kind: 'issue', label: '#4790 Bulk acknowledge anomalies', from: 15, len: 4, done: 0 },
      { kind: 'issue', label: '#4762 Legacy CSV import drops orbit', from: 5, len: 4, done: 0, late: true }
    ];

    var areaW = days * DAY, h = HDR + rows.length * ROW + 8;
    var subj = '', area = '';

    subj += '<div class="gantt_hdr" style="left:0;top:0;width:' + (SUBJ - 1) + 'px;height:' + (HDR - 1) + 'px;line-height:' + (HDR - 1) + 'px">Subject</div>';
    subj += '<div class="gantt_subjects" style="position:absolute;top:' + HDR + 'px;left:0;width:' + SUBJ + 'px">';
    rows.forEach(function (r, i) {
      subj += '<div class="' + (r.kind === 'version' ? 'version-name' : 'issue-subject') +
        '" style="position:absolute;top:' + (i * ROW + 2) + 'px;left:8px;width:' + (SUBJ - 16) + 'px">' +
        '<a href="' + (r.kind === 'version' ? '?page=roadmap' : '?page=issue') + '">' + r.label + '</a></div>';
    });
    subj += '</div>';

    area += '<div class="gantt_hdr" style="left:0;top:0;width:' + (areaW - 1) + 'px">August 2026</div>';
    for (var w = 0; w < 3; w++) {
      area += '<div class="gantt_hdr" style="left:' + (w * 7 * DAY) + 'px;top:16px;width:' + (7 * DAY - 1) + 'px">week ' + (32 + w) + '</div>';
    }
    for (var d = 0; d < days; d++) {
      var date = new Date(start.getTime() + d * 86400000);
      var dow = (date.getDay() + 6) % 7;
      area += '<div class="gantt_hdr' + (dow > 4 ? ' nwday' : '') + '" style="left:' + (d * DAY) + 'px;top:32px;width:' + (DAY - 1) + 'px">' +
        date.getDate() + '</div>';
    }
    area += '<div id="gantt-today-line" style="left:' + (5 * DAY) + 'px;top:' + HDR + 'px;height:' + (rows.length * ROW) + 'px"></div>';

    rows.forEach(function (r, i) {
      var top = HDR + i * ROW + 4, left = r.from * DAY, w = r.len * DAY;
      var parent = r.kind === 'version' ? ' parent' : '';
      var cls = r.late ? 'task_late' : 'task_todo';
      area += '<div class="task ' + cls + parent + '" style="top:' + top + 'px;left:' + left + 'px;width:' + w + 'px"></div>';
      if (r.done > 0) {
        area += '<div class="task task_done' + parent + '" style="top:' + top + 'px;left:' + left + 'px;width:' + Math.round(w * r.done / 100) + 'px"></div>';
      }
      area += '<div class="task label" style="top:' + top + 'px;left:' + (left + w + 6) + 'px">' + r.done + '%</div>';
    });

    mount.innerHTML =
      '<div style="overflow:auto hidden"><table class="gantt-table"><tbody><tr>' +
        '<td class="gantt_subjects_column" style="width:' + SUBJ + 'px">' +
          '<div class="gantt_subjects_container" style="position:relative;width:' + SUBJ + 'px;height:' + h + 'px">' + subj + '</div>' +
        '</td>' +
        '<td><div id="gantt_area" style="position:relative;width:' + areaW + 'px;height:' + h + 'px;overflow:hidden">' + area + '</div></td>' +
      '</tr></tbody></table></div>';
  }
})();
</script>
